server.port=8899
spring.application.name=oAT-service-web
server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.max-http-request-header-size=102400

spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

logging.level.root=${OAT_LOG_LEVEL:INFO}
logging.level.com.oAT=${OAT_APP_LOG_LEVEL:INFO}
logging.level.audit.security=${OAT_SECURITY_LOG_LEVEL:INFO}
logging.level.audit.business=${OAT_BUSINESS_LOG_LEVEL:INFO}
logging.level.monitor.performance=${OAT_PERFORMANCE_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${OAT_SPRING_WEB_LOG_LEVEL:WARN}
logging.level.org.springframework.jdbc.core=${OAT_SQL_LOG_LEVEL:WARN}
logging.structured.format.console=${OAT_CONSOLE_LOG_FORMAT:logstash}
logging.structured.format.file=${OAT_FILE_LOG_FORMAT:logstash}
logging.file.path=${OAT_LOG_PATH:${user.home}/oAT/logs}
logging.file.name=${OAT_LOG_FILE:${logging.file.path}/oAT-service-web.log}
logging.logback.rollingpolicy.file-name-pattern=${OAT_LOG_FILE_PATTERN:${logging.file.path}/archive/oAT-service-web.%d{yyyy-MM-dd}.%i.log.gz}
logging.logback.rollingpolicy.max-file-size=${OAT_LOG_MAX_FILE_SIZE:50MB}
logging.logback.rollingpolicy.max-history=${OAT_LOG_MAX_HISTORY:30}
logging.logback.rollingpolicy.total-size-cap=${OAT_LOG_TOTAL_SIZE_CAP:2GB}
logging.logback.rollingpolicy.clean-history-on-start=${OAT_LOG_CLEAN_HISTORY_ON_START:false}
logging.structured.json.stacktrace.max-length=${OAT_LOG_STACKTRACE_MAX_LENGTH:20000}
logging.structured.json.stacktrace.max-throwable-depth=${OAT_LOG_STACKTRACE_MAX_DEPTH:20}
oat.logging.request.enabled=${OAT_REQUEST_LOG_ENABLED:true}
oat.logging.request.success-sample-rate=${OAT_REQUEST_SUCCESS_SAMPLE_RATE:10}
oat.logging.request.slow-threshold-ms=${OAT_REQUEST_SLOW_MS:1000}
oat.logging.request.warn-threshold-ms=${OAT_REQUEST_WARN_MS:3000}
oat.logging.request.max-field-length=${OAT_LOG_FIELD_MAX_LENGTH:256}
oat.logging.request.excluded-path-prefixes=/favicon,/assets/,/static/,/webjars/,/r/,/images/

spring.datasource.url=${OAT_DB_URL:jdbc:postgresql://127.0.0.1:5432/ai_requirement_verification}
spring.datasource.username=${OAT_DB_USERNAME:traceiq}
spring.datasource.password=${OAT_DB_PASSWORD:traceiq}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.initial-size=2
spring.datasource.druid.min-idle=2
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000
oat.datasource.postgresql.create-database-if-missing=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

oat.data.path=${user.home}/oAT/codeData/
oat.storage.large-payload.path=${oat.data.path}large-payload/
oat.storage.static-source.inline-threshold-bytes=8192

ai.llm.enabled=true
ai.llm.provider=deepseek
ai.llm.base-url=https://api.deepseek.com
ai.llm.api-key=${AI_LLM_API_KEY:}
ai.llm.model=${AI_LLM_MODEL:deepseek-chat}
ai.llm.max-tokens=8192
ai.llm.temperature=0.7
ai.llm.timeout=300
ai.llm.log-requests=false
ai.llm.log-responses=false
ai.llm.system-prompt-prefix=你是一个专业的软件需求一致性分析服务，专注于需求、用例、源码和运行证据的结构化分析。
